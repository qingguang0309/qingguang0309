<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Cao Yang — PhD Candidate, Peking University · LLM Research Agents · AI for Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#14254d"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#f2c464" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f2c464" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>

  <!-- network motif: hub and workers -->
  <g stroke="#7aa2ff" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <line x1="980" y1="130" x2="900" y2="70"/>
    <line x1="980" y1="130" x2="1080" y2="64"/>
    <line x1="980" y1="130" x2="890" y2="196"/>
    <line x1="980" y1="130" x2="1090" y2="200"/>
    <line x1="980" y1="130" x2="1120" y2="132"/>
  </g>
  <g fill="#7aa2ff" fill-opacity="0.85">
    <circle cx="900" cy="70" r="7"/>
    <circle cx="1080" cy="64" r="7"/>
    <circle cx="890" cy="196" r="7"/>
    <circle cx="1090" cy="200" r="7"/>
    <circle cx="1120" cy="132" r="7"/>
  </g>
  <circle cx="980" cy="130" r="22" fill="#f2c464"/>
  <circle cx="980" cy="130" r="34" fill="none" stroke="#f2c464" stroke-opacity="0.35" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#e05a5e" font-size="18" font-weight="600" letter-spacing="1">PHD CANDIDATE · PEKING UNIVERSITY</text>
    <text x="64" y="152" fill="#ffffff" font-size="56" font-weight="800">Cao Yang</text>
    <text x="64" y="194" fill="#c7d2e6" font-size="21" font-weight="500">LLM Research Agents · Deep Research · AI for Science</text>
    <rect x="352" y="114" width="196" height="40" rx="20" fill="#f2c464" fill-opacity="0.16" stroke="#f2c464" stroke-opacity="0.6"/>
    <text x="450" y="140" fill="#f2c464" font-size="17" font-weight="700" text-anchor="middle">#1 on GAIA · 94.35%</text>
  </g>
